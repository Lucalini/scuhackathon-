<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>VI Triage</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- top bar -->
  <header class="top-bar">
    <div class="logo">
      <span class="logo-icon">&#9764;</span>
      <span class="logo-text">VI Triage</span>
    </div>
    <div class="status-indicators">
      <span class="status-dot" id="status-cam" title="Camera"></span>
      <span class="status-label">CAM</span>
      <span class="status-dot" id="status-vlm" title="VLM"></span>
      <span class="status-label">VLM</span>
      <span class="status-dot" id="status-temp" title="Temp Sensor"></span>
      <span class="status-label">TEMP</span>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <!-- main layout -->
  <main class="main-grid">
    <!-- camera panel -->
    <section class="panel camera-panel">
      <div class="panel-header">
        <span class="panel-title">Camera</span>
        <div class="panel-actions">
          <button class="btn btn-sm" id="btn-capture" title="Capture">
            <span class="btn-icon">&#9673;</span> Capture
          </button>
        </div>
      </div>
      <div class="camera-viewport" id="camera-viewport">
        <div class="camera-placeholder" id="camera-placeholder">
          <span class="camera-icon">&#128247;</span>
          <span>Tap Capture to take a photo</span>
        </div>
        <img id="camera-preview" class="camera-preview hidden" alt="Captured frame">
      </div>
      <div class="camera-controls">
        <button class="btn btn-primary" id="btn-upload-vlm">
          <span class="btn-icon">&#9881;</span> Analyze with VLM
        </button>
        <button class="btn btn-outline" id="btn-reset-capture">
          Reset
        </button>
      </div>
    </section>

    <!-- right column -->
    <div class="right-column">
      <!-- chat panel -->
      <section class="panel chat-panel">
        <div class="panel-header">
          <span class="panel-title">VLM Chat</span>
          <span class="model-badge">Qwen2-VL-7B</span>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-welcome">
            <p>AI-powered visual triage assistant ready.</p>
            <p class="chat-hint">Capture an image or type a question below.</p>
          </div>
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chat-input" placeholder="Ask about the patient..." autocomplete="off" readonly>
          <button class="btn btn-primary btn-send" id="btn-send">&#10148;</button>
        </div>
      </section>

      <!-- bottom row -->
      <div class="bottom-row">
        <!-- Temperature -->
        <section class="panel temp-panel">
          <div class="panel-header">
            <span class="panel-title">Temperature</span>
            <div class="temp-current">
              <span class="temp-value" id="temp-value">--</span>
              <span class="temp-unit">°C</span>
            </div>
          </div>
          <div class="temp-chart-wrap">
            <canvas id="temp-chart"></canvas>
          </div>
        </section>

        <!-- sensor log -->
        <section class="panel log-panel">
          <div class="panel-header">
            <span class="panel-title">Sensor Log</span>
            <button class="btn btn-sm btn-danger" id="btn-reset-all" title="Reset All">Reset</button>
          </div>
          <div class="log-entries" id="log-entries">
            <div class="log-empty">No events yet</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- On-Screen Keyboard -->
  <div class="keyboard-overlay hidden" id="keyboard-overlay">
    <div class="keyboard" id="keyboard"></div>
  </div>

  <!-- loading overlay -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
    <span class="loading-text" id="loading-text">Processing...</span>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
