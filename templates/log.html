{% extends "base.html" %}
{% block title %}Patient Log — FieldTriage AI{% endblock %}

{% block content %}
<div class="log-page" style="display: flex; flex-direction: column; height: calc(480px - 32px); overflow: hidden;">
  <a href="/" class="btn btn-outline back-link">← Back to Triage</a>
  <div class="panel" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
    <div class="panel-header">
      <span class="panel-title">Patient log</span>
    </div>
    <div id="log-list" class="log-list">
      <div id="log-list-empty" class="log-list-empty hidden">No entries yet. Capture from the Triage screen.</div>
      <!-- log list from api -->
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/log-detail.js"></script>
{% endblock %}
