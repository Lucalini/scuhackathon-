<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>{% block title %}FieldTriage AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <!-- top bar -->
  <header class="top-bar">
    <div class="logo">
      <span class="logo-icon">&#9764;</span>
      <span class="logo-text">FieldTriage AI</span>
    </div>
    <nav class="top-nav">
      <a href="/" class="nav-link {% if request.url.path == '/' %}nav-link--active{% endif %}">Triage</a>
      <a href="/log" class="nav-link {% if request.url.path.startswith('/log') %}nav-link--active{% endif %}">Log</a>
    </nav>
    <div class="top-bar-right">
      <div class="status-indicators">
        <span class="status-dot" id="status-cam" title="Camera"></span>
        <span class="status-label">CAM</span>
        <span class="status-dot" id="status-vlm" title="VLM"></span>
        <span class="status-label">VLM</span>
        <span class="status-dot" id="status-temp" title="Temp"></span>
        <span class="status-label">TEMP</span>
      </div>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- toast container -->
  <div id="toast-container"></div>
  <button
    type="button"
    id="btn-fullscreen"
    class="fullscreen-btn"
    title="Toggle fullscreen"
    aria-label="Toggle fullscreen"
  >⛶</button>
  <script src="/static/js/ui-shell.js"></script>

  {% block scripts %}
  <script src="/static/js/app.js"></script>
  {% endblock %}
</body>
</html>
